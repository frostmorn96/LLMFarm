name: Build Unsigned IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          cmake --version | head -n1

      - name: Build llama.xcframework from source
        working-directory: llmfarm_core.swift/llama.cpp
        run: |
          chmod +x build-xcframework.sh
          ./build-xcframework.sh
          ls -la build-apple/llama.xcframework

      - name: List schemes
        run: xcodebuild -project LLMFarm.xcodeproj -list

      - name: Build (unsigned)
        run: |
          set -euxo pipefail
          xcodebuild \
            -project LLMFarm.xcodeproj \
            -scheme LLMFarm_Release \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          set -euxo pipefail
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -n1)
          echo "App: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry LLMFarm-unsigned.ipa Payload
          ls -lh LLMFarm-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LLMFarm-unsigned-ipa
          path: LLMFarm-unsigned.ipa
          if-no-files-found: error
